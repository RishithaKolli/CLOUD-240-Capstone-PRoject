name: Release
'on':
  push:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}
permissions: {}
jobs:
  release:
    if: github.repository == 'sveltejs/svelte'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 24.x
        cache: pnpm
    - name: Install
      run: pnpm install --frozen-lockfile
    - name: Build
      run: pnpm build && { [ "`git status --porcelain=v1`" == "" ] || (echo "Generated types have changed — please regenerate types locally with \`cd packages/svelte && pnpm generate:types\` and commit
        the changes after you have reviewed them"; git diff; exit 1); }
    - name: Create Release Pull Request or Publish to npm
      id: changesets
      uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf
      with:
        version: pnpm changeset:version
        publish: pnpm changeset:publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NPM_CONFIG_PROVENANCE: true
