name: CI
env:
  NODE_OPTIONS: --max-old-space-size=6144
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  VITEST_SEGFAULT_RETRY: 3
permissions: {}
'on':
  push:
    branches:
    - main
    - release/*
    - feat/*
    - fix/*
    - perf/*
    - v[0-9]+
    - v[0-9]+.[0-9]+
  pull_request: null
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true
jobs:
  changed:
    name: Get changed files
    runs-on: ubuntu-slim
    outputs:
      should_skip: ${{ steps.changed-files.outputs.only_changed == 'true' }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 50
        persist-credentials: false
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      with:
        files: 'docs/**

          .github/**

          !.github/workflows/ci.yml

          packages/create-vite/template**

          **.md

          '
  test:
    needs: changed
    if: needs.changed.outputs.should_skip != 'true'
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        node_version:
        - 20
        - 22
        - 24
        - 26
        include:
        - os: macos-latest
          node_version: 24
        - os: windows-latest
          node_version: 24
      fail-fast: false
    name: 'Build&Test: node-${{ matrix.node_version }}, ${{ matrix.os }}'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - if: matrix.node_version != '20'
      name: Install pnpm and node ${{ matrix.node_version }}
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
      with:
        runtime: node@${{ matrix.node_version }}
        cache: true
    - if: matrix.node_version == '20'
      name: Install pnpm and node 24 for builds
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
      with:
        runtime: node@24
        cache: true
    - name: (non-windows) Set Playwright path and Get playwright version
      if: runner.os != 'Windows'
      run: 'echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/playwright-bin" >> $GITHUB_ENV

        PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output ''.[0].devDependencies["playwright-chromium"].version'')"

        echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

        '
    - name: (windows) Set Playwright path and Get playwright version
      if: runner.os == 'Windows'
      run: 'echo "PLAYWRIGHT_BROWSERS_PATH=$HOME\.cache\playwright-bin" >> $env:GITHUB_ENV

        $env:PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output ''.[0].devDependencies["playwright-chromium"].version'')"

        echo "PLAYWRIGHT_VERSION=$env:PLAYWRIGHT_VERSION" >> $env:GITHUB_ENV

        '
    - name: Cache Playwright's binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key: ${{ runner.os }}-playwright-bin-v1-${{ env.PLAYWRIGHT_VERSION }}
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        restore-keys: '${{ runner.os }}-playwright-bin-v1-

          '
    - name: Install Playwright
      run: pnpm playwright install chromium
    - name: Build
      run: pnpm run build
    - if: matrix.node_version == '20'
      name: Set node version to ${{ matrix.node_version }}
      run: pnpm runtime set node ${{ matrix.node_version }} -g
    - name: Test unit
      run: pnpm run test-unit
    - name: Test serve
      run: pnpm run test-serve
    - name: Test serve (bundled dev)
      run: pnpm run test-serve-bundled
    - name: Test build
      run: pnpm run test-build
  test-passed:
    if: (!cancelled() && !failure())
    needs: test
    runs-on: ubuntu-slim
    name: Build & Test Passed or Skipped
    steps:
    - run: echo "Build & Test Passed or Skipped"
  test-failed:
    if: (!cancelled() && failure())
    needs: test
    runs-on: ubuntu-slim
    name: Build & Test Failed
    steps:
    - run: echo "Build & Test Failed"
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: 'Lint: node-24, ubuntu-latest'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pnpm and node 24
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
      with:
        runtime: node@24
        cache: true
    - name: Build
      run: pnpm run build
    - name: Lint
      run: pnpm run lint
    - name: Check formatting
      run: pnpm format && git diff --exit-code
    - name: Typecheck
      run: pnpm run typecheck
    - name: Test docs
      run: pnpm run test-docs
