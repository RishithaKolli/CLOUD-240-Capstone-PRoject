name: Test
'on':
  push:
    branches:
    - main
    paths-ignore:
    - '**.md'
  pull_request:
    paths-ignore:
    - '**.md'
permissions:
  contents: read
  actions: write
jobs:
  build:
    name: Build
    strategy:
      matrix:
        runs-on:
        - ubuntu-latest
        - macos-latest
        - windows-latest
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Compile
      run: npm run build
    - name: Lint
      run: npm run lint
    - name: Format
      run: npm run format-check
    - name: Test
      run: npm run test
    - name: Create artifact files
      run: 'mkdir -p path/to/dir-1

        mkdir -p path/to/dir-2

        mkdir -p path/to/dir-3

        mkdir -p symlink/

        echo "Lorem ipsum dolor sit amet" > path/to/dir-1/file1.txt

        echo "Hello world from file #2" > path/to/dir-2/file2.txt

        echo "Hello from a symlinked file" > symlink/original.txt

        ln -s $(pwd)/symlink/original.txt symlink/abs.txt

        ln -s original.txt symlink/rel.txt

        '
      shell: bash
    - name: 'Upload artifact #1'
      uses: ./
      with:
        name: Artifact-A-${{ matrix.runs-on }}
        path: path/to/dir-1/file1.txt
    - name: 'Upload artifact #2'
      uses: ./
      with:
        name: Artifact-Wildcard-${{ matrix.runs-on }}
        path: path/**/dir*/
    - name: 'Upload artifact #3'
      uses: ./
      with:
        name: Multi-Path-Artifact-${{ matrix.runs-on }}
        path: 'path/to/dir-1/*

          path/to/dir-[23]/*

          !path/to/dir-3/*.txt

          '
    - name: Upload symlinked artifact
      uses: ./
      with:
        name: Symlinked-Artifact-${{ matrix.runs-on }}
        path: 'symlink/abs.txt

          symlink/rel.txt

          '
    - name: 'Download artifact #1'
      uses: actions/download-artifact@main
      with:
        name: Artifact-A-${{ matrix.runs-on }}
        path: some/new/path
    - name: 'Verify Artifact #1'
      run: "$file = \"some/new/path/file1.txt\"\nif(!(Test-Path -path $file))\n{\n    Write-Error \"Expected file does not exist\"\n}\nif(!((Get-Content $file) -ceq \"Lorem ipsum dolor sit amet\"))\n{\n\
        \    Write-Error \"File contents of downloaded artifact are incorrect\"\n}\n"
      shell: pwsh
    - name: 'Download artifact #2'
      uses: actions/download-artifact@main
      with:
        name: Artifact-Wildcard-${{ matrix.runs-on }}
        path: some/other/path
    - name: 'Verify Artifact #2'
      run: "$file1 = \"some/other/path/to/dir-1/file1.txt\"\n$file2 = \"some/other/path/to/dir-2/file2.txt\"\nif(!(Test-Path -path $file1) -or !(Test-Path -path $file2))\n{\n    Write-Error \"Expected files\
        \ do not exist\"\n}\nif(!((Get-Content $file1) -ceq \"Lorem ipsum dolor sit amet\") -or !((Get-Content $file2) -ceq \"Hello world from file #2\"))\n{\n    Write-Error \"File contents of downloaded\
        \ artifacts are incorrect\"\n}\n"
      shell: pwsh
    - name: 'Download artifact #4'
      uses: actions/download-artifact@main
      with:
        name: Multi-Path-Artifact-${{ matrix.runs-on }}
        path: multi/artifact
    - name: 'Verify Artifact #4'
      run: "$file1 = \"multi/artifact/dir-1/file1.txt\"\n$file2 = \"multi/artifact/dir-2/file2.txt\"\nif(!(Test-Path -path $file1) -or !(Test-Path -path $file2))\n{\n    Write-Error \"Expected files do\
        \ not exist\"\n}\nif(!((Get-Content $file1) -ceq \"Lorem ipsum dolor sit amet\") -or !((Get-Content $file2) -ceq \"Hello world from file #2\"))\n{\n    Write-Error \"File contents of downloaded\
        \ artifacts are incorrect\"\n}\n"
      shell: pwsh
    - name: Download symlinked artifact
      uses: actions/download-artifact@main
      with:
        name: Symlinked-Artifact-${{ matrix.runs-on }}
        path: from/symlink
    - name: Verify symlinked artifact
      run: "$abs = \"from/symlink/abs.txt\"\nif(!(Test-Path -path $abs))\n{\n    Write-Error \"Expected file does not exist\"\n}\nif(!((Get-Content $abs) -ceq \"Hello from a symlinked file\"))\n{\n    Write-Error\
        \ \"File contents of downloaded artifact are incorrect\"\n}\n$rel = \"from/symlink/rel.txt\"\nif(!(Test-Path -path $rel))\n{\n    Write-Error \"Expected file does not exist\"\n}\nif(!((Get-Content\
        \ $rel) -ceq \"Hello from a symlinked file\"))\n{\n    Write-Error \"File contents of downloaded artifact are incorrect\"\n}\n"
      shell: pwsh
    - name: Alter file 1 content
      run: 'echo "This file has changed" > path/to/dir-1/file1.txt

        '
    - name: 'Overwrite artifact #1'
      uses: ./
      with:
        name: Artifact-A-${{ matrix.runs-on }}
        path: path/to/dir-1/file1.txt
        overwrite: true
    - name: 'Download artifact #1 again'
      uses: actions/download-artifact@main
      with:
        name: Artifact-A-${{ matrix.runs-on }}
        path: overwrite/some/new/path
    - name: 'Verify Artifact #1 again'
      run: "$file = \"overwrite/some/new/path/file1.txt\"\nif(!(Test-Path -path $file))\n{\n    Write-Error \"Expected file does not exist\"\n}\nif(!((Get-Content $file) -ceq \"This file has changed\"))\n\
        {\n    Write-Error \"File contents of downloaded artifact are incorrect\"\n}\n"
      shell: pwsh
    - name: Create direct upload file
      run: echo -n 'direct file upload content' > direct-upload-${{ matrix.runs-on }}.txt
      shell: bash
    - name: Upload direct file artifact
      uses: ./
      with:
        name: Direct-File-${{ matrix.runs-on }}
        path: direct-upload-${{ matrix.runs-on }}.txt
        archive: false
    - name: Download direct file artifact
      uses: actions/download-artifact@main
      with:
        name: direct-upload-${{ matrix.runs-on }}.txt
        path: direct-download
    - name: Verify direct file artifact
      run: "$file = \"direct-download/direct-upload-${{ matrix.runs-on }}.txt\"\nif(!(Test-Path -path $file))\n{\n    Write-Error \"Expected file does not exist\"\n}\nif(!((Get-Content $file -Raw).TrimEnd()\
        \ -ceq \"direct file upload content\"))\n{\n    Write-Error \"File contents of downloaded artifact are incorrect\"\n}\n"
      shell: pwsh
  upload-html-report:
    name: Upload HTML Report
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Compile
      run: npm run build
    - name: Create HTML report
      run: "cat > report.html << 'EOF'\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Artifact\
        \ Upload Test Report</title>\n  <style>\n    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px;\
        \ color: #24292f; }\n    h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 8px; }\n    .success { color: #1a7f37; }\n    .info { background: #ddf4ff; border: 1px solid #54aeff; border-radius:\
        \ 6px; padding: 12px 16px; margin: 16px 0; }\n    table { border-collapse: collapse; width: 100%; margin: 16px 0; }\n    th, td { border: 1px solid #d0d7de; padding: 8px 12px; text-align: left;\
        \ }\n    th { background: #f6f8fa; }\n  </style>\n</head>\n<body>\n  <h1>Artifact Upload Test Report</h1>\n  <div class=\"info\">\n    <strong>This HTML file was uploaded as a single un-zipped artifact.</strong>\n\
        \    If you can see this in the browser, the feature is working correctly!\n  </div>\n  <table>\n    <tr><th>Property</th><th>Value</th></tr>\n    <tr><td>Upload method</td><td><code>archive: false</code></td></tr>\n\
        \    <tr><td>Content-Type</td><td><code>text/html</code></td></tr>\n    <tr><td>File</td><td><code>report.html</code></td></tr>\n  </table>\n  <p class=\"success\">&#10004; Single file upload is\
        \ working!</p>\n</body>\n</html>\nEOF\n"
    - name: Upload HTML report (no archive)
      uses: ./
      with:
        name: test-report
        path: report.html
        archive: false
  merge:
    name: Merge
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Merge all artifacts in run
      uses: ./merge/
      with:
        separate-directories: true
    - name: Download merged artifacts
      uses: actions/download-artifact@main
      with:
        name: merged-artifacts
        path: all-merged-artifacts
    - name: Check merged artifact has directories for each artifact
      run: "$artifacts = @(\n  \"Artifact-A-ubuntu-latest\",\n  \"Artifact-A-macos-latest\",\n  \"Artifact-A-windows-latest\",\n  \"Artifact-Wildcard-ubuntu-latest\",\n  \"Artifact-Wildcard-macos-latest\"\
        ,\n  \"Artifact-Wildcard-windows-latest\",\n  \"Multi-Path-Artifact-ubuntu-latest\",\n  \"Multi-Path-Artifact-macos-latest\",\n  \"Multi-Path-Artifact-windows-latest\"\n)\n\nforeach ($artifact in\
        \ $artifacts) {\n  $path = \"all-merged-artifacts/$artifact\"\n  if (!(Test-Path $path)) {\n    Write-Error \"$path does not exist.\"\n  }\n}\n"
      shell: pwsh
    - name: Merge all Artifact-A
      uses: ./merge/
      with:
        name: Merged-Artifact-As
        pattern: Artifact-A-*
        separate-directories: true
    - name: Download merged artifacts
      uses: actions/download-artifact@main
      with:
        name: Merged-Artifact-As
        path: merged-artifact-a
    - name: Verify merged artifacts
      run: "$files = @(\n  \"merged-artifact-a/Artifact-A-ubuntu-latest/file1.txt\",\n  \"merged-artifact-a/Artifact-A-macos-latest/file1.txt\",\n  \"merged-artifact-a/Artifact-A-windows-latest/file1.txt\"\
        \n)\n\nforeach ($file in $files) {\n  if (!(Test-Path $file)) {\n    Write-Error \"$file does not exist.\"\n  }\n\n  if (!((Get-Content $file) -ceq \"This file has changed\")) {\n    Write-Error\
        \ \"$file has incorrect content.\"\n  }\n}\n"
      shell: pwsh
  cleanup:
    name: Cleanup Artifacts
    needs:
    - build
    - merge
    runs-on: ubuntu-latest
    steps:
    - name: Delete test artifacts
      uses: actions/github-script@v8
      with:
        script: "const keep = ['report.html'];\nconst owner = context.repo.owner;\nconst repo = context.repo.repo;\nconst runId = context.runId;\n\nconst {data: {artifacts}} = await github.rest.actions.listWorkflowRunArtifacts({\n\
          \  owner,\n  repo,\n  run_id: runId\n});\n\nfor (const a of artifacts) {\n  if (keep.includes(a.name)) {\n    console.log(`Keeping artifact '${a.name}'`);\n    continue;\n  }\n  try {\n    await\
          \ github.rest.actions.deleteArtifact({\n      owner,\n      repo,\n      artifact_id: a.id\n    });\n    console.log(`Deleted artifact '${a.name}'`);\n  } catch (err) {\n    console.log(`Could\
          \ not delete artifact '${a.name}': ${err.message}`);\n  }\n}\n"
