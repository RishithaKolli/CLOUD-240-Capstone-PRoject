name: Clean Control Workflow
'on':
- push
env:
  NODE_ENV: production
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Compute version
      id: version
      run: 'VERSION="1.2.3"

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        '
    - name: Use version
      run: 'echo "Building version ${{ steps.version.outputs.version }}"

        '
    - name: Build artifact
      run: 'mkdir -p dist

        echo "built" > dist/output.txt

        '
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/output.txt
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
    - name: Report build job status
      run: 'echo "Build job outcome: ${{ needs.build.result }}"

        '
    - name: Deploy
      env:
        TARGET_ENV: production
      run: 'echo "Deploying to $TARGET_ENV"

        '
