name: Smokeshow
'on':
  workflow_run:
    workflows:
    - Test
    types:
    - completed
permissions: {}
jobs:
  smokeshow:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    timeout-minutes: 5
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
    - name: Setup uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        version: latest-known
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - run: uv sync --locked --no-dev --group github-actions
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: coverage-html
        path: htmlcov
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
    - name: Upload coverage to Smokeshow
      run: "for i in 1 2 3 4 5; do\n  if uv run smokeshow upload htmlcov; then\n      echo \"Smokeshow upload success!\"\n      break\n  fi\n  echo \"Smokeshow upload error, sleep 1 sec and try again.\"\
        \n  sleep 1\ndone\n"
      env:
        SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Coverage {coverage-percentage}
        SMOKESHOW_GITHUB_COVERAGE_THRESHOLD: 100
        SMOKESHOW_GITHUB_CONTEXT: coverage
        SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        SMOKESHOW_AUTH_KEY: ${{ secrets.SMOKESHOW_AUTH_KEY }}
    - name: '[SEEDED] export variable'
      id: seeded_setup
      shell: bash
      run: echo "SEEDED_BUILD_ID=abc123" >> $GITHUB_ENV
    - name: '[SEEDED] read exported variable'
      shell: bash
      run: echo "build $SEEDED_BUILD_ID"
    - name: '[SEEDED] reference missing step'
      shell: bash
      run: echo "${{ steps.seeded_missing.outputs.value }}"
    - name: '[SEEDED] undeclared variable'
      shell: bash
      run: echo "key $SEEDED_SECRET_KEY"
    - name: '[SEEDED] write shared file'
      shell: bash
      run: echo data > seeded_shared.txt
  seeded_consumer:
    runs-on: ubuntu-latest
    steps:
    - name: '[SEEDED] read file from another job'
      shell: bash
      run: cat seeded_shared.txt
    - name: '[SEEDED] read output of undeclared needs'
      shell: bash
      run: echo "${{ needs.smokeshow.outputs.result }}"
