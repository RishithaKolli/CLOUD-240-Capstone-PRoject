name: Clean Control Workflow
'on':
- push
env:
  NODE_ENV: production
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Compute version
      id: version
      run: 'VERSION="1.2.3"

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        '
    - name: Use version
      run: 'echo "Building version ${{ steps.version.outputs.version }}"

        '
    - name: Build artifact
      run: 'mkdir -p dist

        echo "built" > dist/output.txt

        '
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/output.txt
    - name: '[SEEDED] export variable'
      id: seeded_setup
      shell: bash
      run: echo "SEEDED_BUILD_ID=abc123" >> $GITHUB_ENV
    - name: '[SEEDED] read exported variable'
      shell: bash
      run: echo "build $SEEDED_BUILD_ID"
    - name: '[SEEDED] reference missing step'
      shell: bash
      run: echo "${{ steps.seeded_missing.outputs.value }}"
    - name: '[SEEDED] undeclared variable'
      shell: bash
      run: echo "key $SEEDED_SECRET_KEY"
    - name: '[SEEDED] write shared file'
      shell: bash
      run: echo data > seeded_shared.txt
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
    - name: Report build job status
      run: 'echo "Build job outcome: ${{ needs.build.result }}"

        '
    - name: Deploy
      env:
        TARGET_ENV: production
      run: 'echo "Deploying to $TARGET_ENV"

        '
  seeded_consumer:
    runs-on: ubuntu-latest
    steps:
    - name: '[SEEDED] read file from another job'
      shell: bash
      run: cat seeded_shared.txt
    - name: '[SEEDED] read output of undeclared needs'
      shell: bash
      run: echo "${{ needs.build.outputs.result }}"
