name: deploy
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 1.2.3
permissions: {}
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYTEST: ${{ github.event.inputs.version }}
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Build and Check Package
      uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5
      with:
        attest-build-provenance-github: 'true'
    - name: '[SEEDED] export variable'
      id: seeded_setup
      shell: bash
      run: echo "SEEDED_BUILD_ID=abc123" >> $GITHUB_ENV
    - name: '[SEEDED] read exported variable'
      shell: bash
      run: echo "build $SEEDED_BUILD_ID"
    - name: '[SEEDED] reference missing step'
      shell: bash
      run: echo "${{ steps.seeded_missing.outputs.value }}"
    - name: '[SEEDED] undeclared variable'
      shell: bash
      run: echo "key $SEEDED_SECRET_KEY"
    - name: '[SEEDED] write shared file'
      shell: bash
      run: echo data > seeded_shared.txt
  generate-gh-release-notes:
    needs:
    - package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up tox
      uses: $/.github/actions/setup-tox
      with:
        python-version: '3.13'
    - name: Generate release notes
      env:
        VERSION: ${{ github.event.inputs.version }}
      run: 'tox -e generate-gh-release-notes -- "$VERSION" gh-release-notes.md

        '
    - name: Upload release notes
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-notes
        path: gh-release-notes.md
        retention-days: 1
  publish-to-pypi:
    if: github.repository == 'pytest-dev/pytest'
    needs:
    - package
    - generate-gh-release-notes
    runs-on: ubuntu-latest
    environment: deploy
    timeout-minutes: 30
    permissions:
      id-token: write
    steps:
    - name: Download Package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: Packages
        path: dist
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      with:
        attestations: true
  push-tag:
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: true
    - name: Push tag
      env:
        VERSION: ${{ github.event.inputs.version }}
      run: 'git config user.name "pytest bot"

        git config user.email "pytestbot@gmail.com"

        git tag --annotate --message=v"$VERSION" "$VERSION" ${{ github.sha }}

        git push origin "$VERSION"

        '
  create-github-release:
    needs:
    - push-tag
    - generate-gh-release-notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Download Package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: Packages
        path: dist
    - name: Download release notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-notes
        path: .
    - name: Publish GitHub Release
      env:
        VERSION: ${{ github.event.inputs.version }}
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'gh release create --notes-file gh-release-notes.md --verify-tag "$VERSION" dist/*

        '
  seeded_consumer:
    runs-on: ubuntu-latest
    steps:
    - name: '[SEEDED] read file from another job'
      shell: bash
      run: cat seeded_shared.txt
    - name: '[SEEDED] read output of undeclared needs'
      shell: bash
      run: echo "${{ needs.package.outputs.result }}"
