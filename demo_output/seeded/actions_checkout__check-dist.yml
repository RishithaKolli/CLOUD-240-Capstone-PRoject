name: Check dist
'on':
  push:
    branches:
    - main
    paths-ignore:
    - '**.md'
  pull_request:
    paths-ignore:
    - '**.md'
  workflow_dispatch: null
jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
    - name: Install dependencies
      run: npm ci
    - name: Rebuild the index.js file
      run: npm run build
    - name: Compare the expected and actual dist/ directories
      run: "if [ \"$(git diff --ignore-space-at-eol dist/ | wc -l)\" -gt \"0\" ]; then\n  echo \"Detected uncommitted changes after build.  See status below:\"\n  git diff\n  exit 1\nfi\n"
    - uses: actions/upload-artifact@v7
      if: ${{ failure() && steps.diff.conclusion == 'failure' }}
      with:
        name: dist
        path: dist/
    - name: '[SEEDED] export variable'
      id: seeded_setup
      shell: bash
      run: echo "SEEDED_BUILD_ID=abc123" >> $GITHUB_ENV
    - name: '[SEEDED] read exported variable'
      shell: bash
      run: echo "build $SEEDED_BUILD_ID"
    - name: '[SEEDED] reference missing step'
      shell: bash
      run: echo "${{ steps.seeded_missing.outputs.value }}"
    - name: '[SEEDED] undeclared variable'
      shell: bash
      run: echo "key $SEEDED_SECRET_KEY"
    - name: '[SEEDED] write shared file'
      shell: bash
      run: echo data > seeded_shared.txt
  seeded_consumer:
    runs-on: ubuntu-latest
    steps:
    - name: '[SEEDED] read file from another job'
      shell: bash
      run: cat seeded_shared.txt
    - name: '[SEEDED] read output of undeclared needs'
      shell: bash
      run: echo "${{ needs.check-dist.outputs.result }}"
